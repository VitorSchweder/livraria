name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: livraria_test
          POSTGRES_USER: livraria
          POSTGRES_PASSWORD: livraria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livraria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://livraria:livraria@127.0.0.1:5432/livraria?serverVersion=17&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, gd, zip
          coverage: none

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Estilo de código
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Análise estática
        run: |
          php bin/console cache:warmup
          vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Migrations no banco de teste
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Schema sincronizado com o mapeamento
        run: php bin/console doctrine:schema:validate --env=test

      - name: Testes
        run: php bin/phpunit
